name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hp34401a-driver-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install documentation dependencies
        run: >-
          python -m pip install --upgrade pip
          "robotframework>=7,<8" "jsonschema>=4.20,<5" "mkdocs>=1.6" "pyyaml>=6.0"
      - name: Install scpi-driver-core
        env:
          SCPI_CORE_PAT: ${{ secrets.SCPI_CORE_PAT }}
        run: >-
          python -m pip install
          "scpi-driver-core @ git+https://x-access-token:${SCPI_CORE_PAT}@github.com/ami3go/scpi-driver-core.git@ec19ab88906d8e6ac270b30d7615ce7e75dc6a08"
        shell: bash
      - name: Install driver source
        run: python -m pip install -e .
      - name: Generate Libdoc
        run: python -m robot.libdoc rf_hp34401a.Hp34401ALibrary docs/Hp34401ALibrary.html
      - name: Build Pages artifact
        run: python -m mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
