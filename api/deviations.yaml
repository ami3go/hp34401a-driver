deviations:
- id: HP34401A-DEV-001
  rules:
  - RFDS-003:R-003-1041
  status: CLOSED
  closed_utc: '2026-08-15T00:00:00Z'
  superseded_utc: '2026-09-10T00:00:00Z'
  reason: >-
    Originally closed because the package declared rfds-core>=1.0,<2.0 as a
    mandatory runtime dependency. That package was never published anywhere
    (no PyPI release, no repository), so the requirement's substance -- a
    resolvable, version-constrained shared-core dependency -- was not
    actually met at the time, only its literal text in pyproject.toml.
    The dependency is now scpi-driver-core, a real package pinned to a
    specific commit, which does resolve and install. See
    HP34401A-DEC-003 in api/decisions.yaml for why the package identity
    differs from RFDS-003 SS8.2's literal "rfds-core" example, and
    docs/scpi_driver_core_review.md for the full migration review.
  evidence:
  - pyproject.toml
  - requirements.txt
  - tests/unit/test_rfds_core_packaging.py
  - docs/scpi_driver_core_review.md
  release_effect: None for this closed item.
- id: HP34401A-DEV-002
  rules:
  - RFDS-004:v2.0 canonical byte transport
  status: OPEN
  reason: >-
    Narrowed, not closed, by the scpi-driver-core migration
    (docs/scpi_driver_core_review.md). SerialRs232Transport and
    VisaGpibTransport are now backed by scpi_driver_core.transport.serial /
    .transport.visa, whose Transport protocol matches RFDS-004 SS8's
    canonical byte-oriented interface (state/descriptor/open/close/
    write/read/transact/flush) near-verbatim -- the transport state model
    (SS7), bounded execution (SS4.4), and backend substitution via a real
    simulator (SS4.7, now scpi_driver_core.simulation.scripted) are
    satisfied at the wire layer. Two gaps remain open: (1) the driver's own
    hp34401a_dmm/transports.py::Transport facade, which legacy_driver.py
    actually uses, is still string-typed rather than exposing bytes at the
    protocol-layer seam RFDS-004 SS5's architecture diagram implies; (2)
    the package uses RFDS-004 SS6's "may use a shared package instead of
    duplicated driver-local code" allowance rather than the literal
    transport/backends/ layout, which is permitted provided the version is
    pinned -- now true (a commit SHA, not a floating branch) but was not at
    the time this deviation was first opened.
  evidence:
  - hp34401a_dmm/transports.py
  - hp34401a_dmm/serial_transport.py
  - hp34401a_dmm/visa_transport.py
  - docs/scpi_driver_core_review.md
  release_effect: Release class remains D0 until this deviation is closed or formally approved for the target release.
- id: HP34401A-DEV-003
  rules:
  - RFDS-001 representative real-device validation
  status: OPEN
  reason: >-
    Substantial progress, not yet complete: a genuine HP 34401A (behind a
    XyphroLabs USBTMC GPIB-USB bridge) was connected end to end through the
    actual migrated VisaGpibTransport / pyvisa / pyvisa-py stack -- connect,
    identify(), heartbeat(), and a real query_terminal() front-panel read all
    round-tripped correctly against physical hardware (not just *IDN? via a
    raw file probe). See docs/scpi_driver_core_review.md for the full
    session, including a confirmed pyvisa-py VISA-clear() limitation
    (workaround: clear_on_connect=False) that is a backend limitation, not a
    driver defect. Getting pyvisa-py to see the device at all required two
    fixes now automated by udev/diagnose_usbtmc.sh: unbinding the kernel
    usbtmc driver, and separately fixing /dev/bus/usb/<bus>/<dev> node
    permissions for libusb. What remains open: the full
    tests/hil/verify_all_public_api_real_hardware.robot suite with its
    opt-in measurement profiles has not been run -- that needs a wired,
    approved, safe fixture per guide/hardware_test_setup.md, not just a
    connectivity/identity check.
  release_effect: D2/P1 shall not be claimed.
- id: HP34401A-DEV-004
  rules:
  - RFDS-003:R-003-1031
  status: OPEN
  reason: >-
    Hp34401ALibrary does not inherit an authoritative shared
    BaseInstrumentLibrary. This is no longer "no authoritative package
    exists" -- scpi-driver-core is real and is now a dependency -- but
    scpi-driver-core deliberately does not provide a BaseInstrumentLibrary
    or any RF-aware session/state/lifecycle base class: it is explicitly
    framework-independent (no import of robot/hardpy/pytest anywhere in
    it), governing the RFDS-004 transport layer, not the RFDS-003
    BaseInstrumentLibrary layer. These are different specs governing
    different architectural layers (RFDS-003 SS3.2 explicitly places VISA/
    serial/transport implementation detail out of its own scope, under
    RFDS-004). No package implementing RFDS-003's session registry,
    connection lifecycle, and state model (RFDS-003 SS10-15) exists in this
    codebase or elsewhere as far as this review found. Migrating the
    transport layer onto scpi-driver-core does not make progress on this
    deviation; it should not be read as doing so.
  evidence:
  - docs/scpi_driver_core_review.md
  release_effect: Full RFDS-003 conformance and P1 release are blocked.
- id: HP34401A-DEV-005
  rules:
  - RFDS-003:R-003-1044
  status: CLOSED
  closed_utc: '2026-08-16T00:00:00Z'
  superseded_utc: '2026-09-10T00:00:00Z'
  reason: >-
    Get Driver Information, Get Driver Metadata, plugin validation, and RFDS
    evidence environment metadata now resolve the effective installed
    scpi-driver-core distribution version at runtime (previously rfds-core,
    which could never be installed so this always reported NOT_INSTALLED in
    practice); source checkouts without it installed still report
    NOT_INSTALLED rather than a fabricated version. Field/key names
    (rfds_core_runtime_version, rfds_core_version) are retained for
    RFDS-facing API compatibility even though they resolve scpi-driver-core
    now; see docs/scpi_driver_core_review.md.
  evidence:
  - rf_hp34401a/runtime_library.py
  - rf_hp34401a/plugin.py
  - hp34401a_dmm/evidence.py
  - docs/scpi_driver_core_review.md
  release_effect: None for this closed item; BaseInstrumentLibrary migration remains open under HP34401A-DEV-004.
